name: Kroserbot CI Pipeline

on:
  push:
    branches: [ main, 'tarea/*' ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (informativo)
        run: npm run lint || echo "Linter warning"

      - name: Validate DB Schema Migrations
        run: node db/test-schema.js

      - name: Run Backend Test Suite
        run: npm test
        env:
          NODE_ENV: test

  scraper:
    name: Scraper (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install Dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run Scraper Test Suite
        run: python -m pytest scraper/tests -q
