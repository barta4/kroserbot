name: Bot Kroser CI Pipeline

on:
  push:
    branches: [ main, 'tarea/*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint || echo "Linter warning"

      - name: Validate DB Schema Migrations
        run: node db/test-schema.js

      - name: Run Backend Integration Tests
        run: node backend/test-backend.js
