services:
  # ─── Base de Datos PostgreSQL + pgvector ─────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kroserbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kroser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Kroser.2026}
      POSTGRES_DB: ${POSTGRES_DB:-kroserbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kroser} -d ${POSTGRES_DB:-kroserbot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kroserbot-network

  # ─── Redis (Cache & Sesiones) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kroserbot-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kroserbot-network

  # ─── Backend Node.js (API + RAG + Panel Admin) ────────────
  backend:
    image: alfredobartaburu/kroserbot:v1.2
    container_name: kroserbot-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOMAIN=${DOMAIN:-venta.urufile.duckdns.org}
      # Base de datos
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-kroser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Kroser.2026}
      - POSTGRES_DB=${POSTGRES_DB:-kroserbot}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Seguridad / Panel Admin
      - ADMIN_USER=${ADMIN_USER:-administrador}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Kroser.2026}
      - DEPOSITO_USER=${DEPOSITO_USER:-deposito}
      - DEPOSITO_PASSWORD=${DEPOSITO_PASSWORD:-deposito.2026}
      - JWT_SECRET=${JWT_SECRET:-ikf05ab1gcstakc3xmhi57lkli0r8ubk}
      - WEBHOOK_BASIC_AUTH=${WEBHOOK_BASIC_AUTH:-kroser:kroser2026}
      - CORS_ORIGINS=https://${DOMAIN:-venta.urufile.duckdns.org},http://localhost:3000
      # Inteligencia Artificial
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Chatwoot / Uruchat
      - CHATWOOT_API_URL=${CHATWOOT_API_URL:-https://app.uruchat.com}
      - CHATWOOT_API_TOKEN=${CHATWOOT_API_TOKEN}
      - CHATWOOT_ACCOUNT_ID=${CHATWOOT_ACCOUNT_ID:-1}
      # MercadoPago (Opcional)
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN}
      - MERCADOPAGO_PUBLIC_KEY=${MERCADOPAGO_PUBLIC_KEY}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET}
      - MERCADOPAGO_WEBHOOK_URL=https://${DOMAIN:-venta.urufile.duckdns.org}/api/mercadopago/webhook
      - MERCADOPAGO_SUCCESS_URL=https://${DOMAIN:-venta.urufile.duckdns.org}/admin/#/pedidos
      - MERCADOPAGO_FAILURE_URL=https://${DOMAIN:-venta.urufile.duckdns.org}/admin/#/pedidos
      - MERCADOPAGO_PENDING_URL=https://${DOMAIN:-venta.urufile.duckdns.org}/admin/#/pedidos
      # SMTP / Email (Opcional)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM:-pedidos@kroser.com.uy}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - kroserbot-network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kroserbot.rule=Host(`${DOMAIN:-venta.urufile.duckdns.org}`)"
      - "traefik.http.routers.kroserbot.entrypoints=websecure"
      - "traefik.http.routers.kroserbot.tls=true"
      - "traefik.http.routers.kroserbot.tls.certresolver=letsencrypt"
      - "traefik.http.services.kroserbot.loadbalancer.server.port=3000"

  # ─── Scraper Python (Catalogo Kroser) ────────────────────
  scraper:
    image: alfredobartaburu/kroserbot-scraper:v1.2
    container_name: kroserbot-scraper
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-kroser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Kroser.2026}
      - POSTGRES_DB=${POSTGRES_DB:-kroserbot}
      - KROSER_BASE_URL=${KROSER_BASE_URL:-https://www.kroser.com.uy}
      - SCRAPER_DELAY_MIN=${SCRAPER_DELAY_MIN:-6.0}
      - SCRAPER_DELAY_MAX=${SCRAPER_DELAY_MAX:-11.0}
      - SCRAPER_NO_SLEEP=${SCRAPER_NO_SLEEP:-false}
      - SCRAPER_SCHEDULE_HOUR=${SCRAPER_SCHEDULE_HOUR:-3}
      - SCRAPER_SCHEDULE_MINUTE=${SCRAPER_SCHEDULE_MINUTE:-0}
    networks:
      - kroserbot-network

volumes:
  postgres_data:
    name: kroserbot_postgres_data
  redis_data:
    name: kroserbot_redis_data

networks:
  kroserbot-network:
    name: kroserbot-network
    driver: bridge
  dokploy-network:
    external: true
    name: dokploy-network
