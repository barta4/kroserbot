services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kroserbot-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kroser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kroser}
      POSTGRES_DB: ${POSTGRES_DB:-kroserbot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kroser} -d ${POSTGRES_DB:-kroserbot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kroserbot-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
